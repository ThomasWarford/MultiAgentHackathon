[project]
name = "matchmaker"
version = "0.1.0"
description = "Multi-agent research matchmaking workflow"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Quantumplations", email = "weiduo.deng@gmail.com" },
]
dependencies = [
    "anthropic>=0.40.0",
    "langgraph>=0.2.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "typer>=0.12.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0",
    "structlog>=24.0",
    "pymupdf4llm>=0.0.17",
]

[project.optional-dependencies]
phase2 = [
    "scholarly>=1.7",
    "semanticscholar>=0.8",
]

[project.scripts]
matchmaker = "matchmaker.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/matchmaker"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
